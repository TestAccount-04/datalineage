<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Vibrant Modern Gradients -->
    <linearGradient id="lf-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="lf-grad-cyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="lf-grad-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8" />
    </linearGradient>
    
    <!-- Soft Glow Filter -->
    <filter id="lf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield / Forge Hexagon Base -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
  
  <!-- Subtle Internal Background Ambient Glow -->
  <circle cx="50" cy="50" r="34" fill="url(#lf-grad-primary)" opacity="0.08" />

  <!-- Outer Interconnected Data Lineage Mesh (Hexagonal Circuit Paths) -->
  <path d="M 50 20 L 76 34 L 76 66 L 50 80 L 24 66 L 24 34 Z" 
        fill="none" 
        stroke="url(#lf-grad-primary)" 
        stroke-width="3" 
        stroke-linejoin="round" 
        stroke-linecap="round" />

  <!-- Dynamic Cross-System Lineage Bridges -->
  <path d="M 50 20 L 50 50 L 76 66" 
        fill="none" 
        stroke="url(#lf-grad-cyan)" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-dasharray="4 2" />
        
  <path d="M 24 34 L 50 50 L 24 66" 
        fill="none" 
        stroke="url(#lf-grad-primary)" 
        stroke-width="2.5" 
        stroke-linecap="round" />

  <!-- Glowing Lineage Nodes (Vertices) -->
  <!-- Top Node -->
  <circle cx="50" cy="20" r="5" fill="#2563eb" />
  <circle cx="50" cy="20" r="2.5" fill="#ffffff" />
  
  <!-- Top Right Node -->
  <circle cx="76" cy="34" r="4.5" fill="#4f46e5" />
  <circle cx="76" cy="34" r="2" fill="#ffffff" />

  <!-- Bottom Right Node -->
  <circle cx="76" cy="66" r="4.5" fill="#7c3aed" />
  <circle cx="76" cy="66" r="2" fill="#ffffff" />

  <!-- Bottom Node -->
  <circle cx="50" cy="80" r="5" fill="#2563eb" />
  <circle cx="50" cy="80" r="2.5" fill="#ffffff" />

  <!-- Bottom Left Node -->
  <circle cx="24" cy="66" r="4.5" fill="#0284c7" />
  <circle cx="24" cy="66" r="2" fill="#ffffff" />

  <!-- Top Left Node -->
  <circle cx="24" cy="34" r="4.5" fill="#06b6d4" />
  <circle cx="24" cy="34" r="2" fill="#ffffff" />

  <!-- Central Forge Core Node (Heart of Evidence Fabric) -->
  <circle cx="50" cy="50" r="9" fill="url(#lf-grad-primary)" filter="url(#lf-glow)" />
  <circle cx="50" cy="50" r="5" fill="#ffffff" />
  <circle cx="50" cy="50" r="2.5" fill="#2563eb" />
</svg>
